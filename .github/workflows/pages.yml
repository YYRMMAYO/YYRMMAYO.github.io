name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # 自定义部署步骤：官方 deploy-pages@v4 有 10 分钟超时硬上限，
      # Pages 后端队列延迟时会被 10 分钟卡掉；这里改为最长轮询 50 分钟
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"

          # 1. 获取 OIDC id token
          id_token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "oidc token acquired"

          # 2. 取当前 run 上传的 artifact id
          artifact_id=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/actions/artifacts?name=github-pages&per_page=100" \
            | jq -r --argjson run "$GITHUB_RUN_ID" '.artifacts[] | select(.workflow_run.id == $run) | .id' | sort -n | tail -1)
          if [ -z "$artifact_id" ]; then echo "artifact not found for run $GITHUB_RUN_ID"; exit 1; fi
          echo "artifact id: $artifact_id"

          # 3. 创建 Pages deployment（带重试，规避后端抖动/残留 in-progress 部署）
          deploy_id=""
          for attempt in 1 2 3 4 5; do
            resp=$(curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "{\"artifact_id\": $artifact_id, \"pages_build_version\": \"$GITHUB_SHA\", \"oidc_token\": \"$id_token\"}" \
              "$API/pages/deployments")
            if echo "$resp" | jq -e '.id or .status_url' >/dev/null 2>&1; then
              echo "deployment created: $resp"
              break
            fi
            echo "create attempt $attempt failed: $resp"
            sleep 20
          done
          deploy_id=$(echo "$resp" | jq -r '.id // .status_url // ""' | sed 's|.*/||')
          if [ -z "$deploy_id" ]; then echo "could not create deployment"; exit 1; fi
          echo "deployment id: $deploy_id"

          # 4. 轮询部署状态（每 10 秒，最长约 50 分钟）
          for i in $(seq 1 300); do
            st=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/pages/deployments/$deploy_id" | jq -r .status)
            echo "[$i] deployment status: $st"
            case "$st" in
              succeed)
                echo "DEPLOYED OK"
                exit 0
                ;;
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "deployment failed with status: $st"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "timed out waiting for deployment"
          exit 1
