<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="My software showcase — 我的软件作品集" />
  <title>YYRMM的软件库</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- ===== 顶部导航 ===== -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#" data-i18n="brand">我的软件</a>
      <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch language">EN</button>
    </div>
  </header>

  <!-- ===== Hero 区 ===== -->
  <section class="hero">
    <div class="container">
      <h1 class="hero-title" data-i18n="heroTitle">我的软件作品</h1>
      <p class="hero-sub" data-i18n="heroSub">这里收录了我开发的软件，欢迎试用与反馈。</p>
      <button id="intro-replay" class="btn btn-primary intro-replay" type="button" data-i18n="btnIntro">▶ 观看开场动画</button>
    </div>
  </section>

  <!-- ===== 个人介绍 ===== -->
  <section class="profile container">
    <img id="profile-avatar" class="profile-avatar" src="assets/images/avatar.png" alt="avatar" />
    <div class="profile-info">
      <h2 id="profile-name" class="profile-name"></h2>
      <p id="profile-bio" class="profile-bio"></p>
    </div>
  </section>

  <!-- ===== 软件展示区 ===== -->
  <main class="container">
    <section class="section">
      <h2 class="section-title" data-i18n="sectionTitle">软件列表</h2>
      <p class="section-desc" data-i18n="sectionDesc">点击卡片上的按钮即可下载或访问项目主页。</p>
      <div id="software-grid" class="grid">
        <!-- 卡片由 assets/js/main.js 根据数据动态生成 -->
      </div>
      <p id="empty-state" class="empty-state" hidden data-i18n="emptyState">暂无可展示的软件，敬请期待。</p>
    </section>
  </main>

  <!-- ===== 页脚 ===== -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> <span data-i18n="footerName">我的软件</span> · <span data-i18n="footerHost">托管于 GitHub Pages</span></p>
    </div>
  </footer>

  <!-- ===== 开场动画（首次进入自动播放，可跳过/重播） ===== -->
  <div id="intro-overlay" class="intro-overlay" aria-hidden="true">
    <div class="intro-progress"><div id="intro-progress-bar" class="intro-progress-bar"></div></div>
    <div class="intro-stage">
      <div id="intro-scenes" class="intro-scenes"></div>
    </div>
    <div class="intro-controls">
      <div id="intro-dots" class="intro-dots"></div>
      <button id="intro-skip" class="intro-skip" type="button" data-i18n="introSkip">跳过 ▸</button>
    </div>
  </div>

  <!-- ===== 功能展示弹窗 ===== -->
  <div id="feature-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" data-i18n-aria="modalAria" aria-label="Features">
      <button class="modal-close" type="button" data-close data-i18n-aria="closeAria" aria-label="Close">&times;</button>
      <div id="modal-content" class="modal-content"></div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/showcase.js"></script>
</body>
</html>
